name: Build Android APK + macOS DMG

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unity builds (Linux runner, game-ci): Android APK and macOS .app
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [ Android, StandaloneOSX ]
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: IndianTractorSim
          buildMethod: ${{ matrix.targetPlatform == 'Android' && 'TractorSim.EditorTools.BuildScript.BuildAndroid' || 'TractorSim.EditorTools.BuildScript.BuildMac' }}
          androidExportType: androidPackage
          # we set our own version in BuildScript; don't fail on "dirty branch" checks
          versioning: None
          allowDirtyBuild: true

      - name: Upload APK
        if: matrix.targetPlatform == 'Android'
        uses: actions/upload-artifact@v4
        with:
          name: IndianTractorSim-APK
          path: build/Android/*.apk
          if-no-files-found: error

      # .app bundles lose their executable bits inside plain artifacts, so tar them first
      - name: Pack macOS app
        if: matrix.targetPlatform == 'StandaloneOSX'
        run: sudo tar -czf IndianTractorSim-mac.tar.gz -C build/StandaloneOSX .

      - name: Upload macOS app
        if: matrix.targetPlatform == 'StandaloneOSX'
        uses: actions/upload-artifact@v4
        with:
          name: IndianTractorSim-mac-app
          path: IndianTractorSim-mac.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Wrap the .app into a .dmg (needs a macOS runner for hdiutil)
  # ---------------------------------------------------------------------------
  dmg:
    name: Make macOS DMG
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IndianTractorSim-mac-app

      - name: Create DMG
        run: |
          mkdir -p dmgroot
          tar -xzf IndianTractorSim-mac.tar.gz -C dmgroot
          APP=$(find dmgroot -maxdepth 2 -name "*.app" | head -1)
          echo "App bundle: $APP"
          chmod -R u+rwX,go+rX "$APP"
          chmod +x "$APP"/Contents/MacOS/*
          # ad-hoc signature so Apple-silicon Macs will launch it
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Indian Tractor Simulator" -srcfolder dmgroot -ov -format UDZO IndianTractorSim.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: IndianTractorSim-DMG
          path: IndianTractorSim.dmg
          if-no-files-found: error
